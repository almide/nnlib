name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  test:
    name: Test (native + wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.almide
          key: ${{ runner.os }}-almide-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('almide.lock') }}
          restore-keys: ${{ runner.os }}-almide-${{ env.RUST_TOOLCHAIN }}-
      - name: Install Almide
        run: cargo install --git https://github.com/almide/almide.git --branch develop
      - name: Format
        run: almide fmt --check src spec examples tests
      - name: Tests (wasm leg)
        run: almide test spec/ --target wasm
      - name: Tests (native leg)
        run: bash scripts/test-native.sh
      - name: Golden programs (native + wasm)
        run: bash scripts/test-golden.sh
      - name: Example
        run: |
          almide run examples/llama_block.almd
          almide run examples/llama_block.almd --target wasm
